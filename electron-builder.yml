appId: mame-awesome-ui
productName: mame-awesome-ui
asar: true
directories:
  output: dist_electron
files:
  - out/**/*
  - package.json
  - migrations/**/*
extraResources:
  - from: public/
    to: public/
  # The window icon on Linux (background.ts): an AppImage is not installed, so the desktop does
  # not know the icon electron-builder puts in it.
  - from: build/icon.png
    to: icon.png
artifactName: '${productName}-${version}${env.ARTIFACT_SUFFIX}-${os}-${arch}.${ext}'
linux:
  target: AppImage
  category: Game
mac:
  target: zip
  category: public.app-category.games
win:
  target: nsis
# An installer (Start menu and desktop shortcuts, an entry in Windows' "Installed apps") instead
# of an .exe that ran the app as it was: installed for the current user, without administrator
# rights nor questions. Uninstalling keeps the user's data (%APPDATA%). Not signed: Windows
# SmartScreen warns before running it.
nsis:
  oneClick: true
  perMachine: false
  # Named apart from the application's own .exe.
  artifactName: '${productName}-setup-${version}${env.ARTIFACT_SUFFIX}-${os}-${arch}.${ext}'
