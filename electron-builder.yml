appId: mame-awesome-ui
productName: mame-awesome-ui
asar: true
directories:
  output: dist_electron
files:
  - out/**/*
  - package.json
  - migrations/**/*
extraResources:
  - from: public/
    to: public/
  - from: scripts/import-starting-pack.py
    to: scripts/import-starting-pack.py
artifactName: '${productName}-${version}${env.ARTIFACT_SUFFIX}-${os}-${arch}.${ext}'
linux:
  target: AppImage
  category: Game
mac:
  target: zip
  category: public.app-category.games
