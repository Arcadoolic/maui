name: Release

on:
  push:
    branches:
      - main
  # Rebuilds the binaries of a release already published, when its run did not attach them
  # (cancelled, failed): the build job alone, on the tag, replacing the release's assets. Never
  # fill a release with build.yml's binaries: a develop build bakes "+dev.<sha>" into the
  # version the BO shows (electron.vite.config.ts), as happened to 2.17.0.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild (e.g. 2.17.0)
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release_check.outputs.published }}
      tag: ${{ steps.release_check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Detect published release
        # @semantic-release/github creates the GitHub Release using this
        # job's own GITHUB_TOKEN, and GitHub never triggers a *separate*
        # workflow run from an event authored by the default GITHUB_TOKEN
        # (anti-recursion protection) - so a second workflow reacting to
        # `release: published` never fires. The build+attach job below runs
        # in this same workflow run instead, gated on whether HEAD is now
        # tagged (i.e. semantic-release actually published a release).
        id: release_check
        run: |
          if tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  sync-develop:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-ff -m "chore: sync develop with main after release ${{ needs.release.outputs.tag }}"
          git push origin develop

  build:
    needs: release
    # always(): on a dispatch the release job is skipped, which would skip this one too.
    if: >-
      always() && (needs.release.outputs.published == 'true'
      || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            build_args: --linux --x64
            artifact_glob: dist_electron/*.AppImage
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            build_args: --linux --arm64
            artifact_glob: dist_electron/*.AppImage
          - name: macos-arm64
            runner: macos-14
            build_args: --mac --arm64
            artifact_glob: dist_electron/*.zip
          - name: windows-x64
            runner: windows-latest
            build_args: --win --x64
            artifact_glob: dist_electron/*.exe
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
    steps:
      - name: Check the tag is a published release
        # Only a real release: a dev prerelease's tag (2.17.0+dev.9d2ca10) or a draft is refused.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $RELEASE_TAG"; exit 1; }
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isPrerelease,isDraft \
            --jq 'if .isPrerelease or .isDraft then error("not a published release") else empty end'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python (Windows)
        # windows-latest's default `python` on PATH is 3.12+ with no
        # distutils/setuptools available, so resolve-python.sh below finds
        # nothing usable there - unlike the Linux/macOS runners, which
        # already have a distutils-capable interpreter on PATH. Installing
        # 3.11 here puts a working `python` first on PATH for this job only.
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve Python interpreter for native module build
        # windows-latest's default shell is pwsh, which doesn't support
        # `source` - force bash (Git Bash, present on all GitHub-hosted
        # runners including Windows) so this step works across the matrix.
        shell: bash
        run: |
          source scripts/resolve-python.sh
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Must stay defined (even empty) - electron-builder throws if an
          # artifactName ${env.X} macro is unset. Empty here means release
          # artifacts keep the plain name; build.yml's develop validation
          # sets this to "-dev" instead, so filenames never collide.
          ARTIFACT_SUFFIX: ''
        run: npm run electron:build -- ${{ matrix.build_args }} --publish never

      - name: Attach to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" ${{ matrix.artifact_glob }} --clobber --repo "${{ github.repository }}"
