name: Build

# Validation-only: builds the packaged app on develop pushes/PRs so a build
# regression is caught before it reaches main. The release build (which
# attaches the AppImage to a GitHub Release) lives in release.yml instead -
# see its comment on why that can't be a separate `release: published`
# triggered workflow.
#
# Matrix covers linux-x64, linux-arm64 (Raspberry Pi), macos-arm64, and
# windows-x64.
#
# On a push (not a PR) to develop, the publish-develop-prerelease job below
# additionally republishes the linux-x64/linux-arm64 AppImages as a GitHub
# prerelease - this is what the BO's "Mise à jour" tab lists as develop
# builds for admin accounts (src/boServer.ts's getUpdateInfo(), filtered on
# the GitHub Release `prerelease` flag), replacing the old admin-only
# "builds de PR" mechanism (PR CI artifacts, needed a GitHub token to list).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            build_args: --linux --x64
            artifact_glob: dist_electron/*.AppImage
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            build_args: --linux --arm64
            artifact_glob: dist_electron/*.AppImage
          - name: macos-arm64
            runner: macos-14
            build_args: --mac --arm64
            artifact_glob: dist_electron/*.zip
          - name: windows-x64
            runner: windows-latest
            build_args: --win --x64
            artifact_glob: dist_electron/*.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # pull_request: the PR branch's own commit, not GitHub's ephemeral
          # refs/pull/N/merge (default for this event) - that ref gets GC'd
          # if the PR is merged/closed before the runner fetches it, failing
          # the checkout outright. push: the branch ref as normal.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python (Windows)
        # windows-latest's default `python` on PATH is 3.12+ with no
        # distutils/setuptools available, so resolve-python.sh below finds
        # nothing usable there - unlike the Linux/macOS runners, which
        # already have a distutils-capable interpreter on PATH. Installing
        # 3.11 here puts a working `python` first on PATH for this job only.
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Python interpreter for native module build
        # windows-latest's default shell is pwsh, which doesn't support
        # `source` - force bash (Git Bash, present on all GitHub-hosted
        # runners including Windows) so this step works across the matrix.
        shell: bash
        run: |
          source scripts/resolve-python.sh
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Suffixes develop-validation artifact filenames so they never
          # collide with a same-version release build (electron-builder
          # throws if this is unset - see electron-builder.yml's artifactName).
          ARTIFACT_SUFFIX: -dev
        run: npm run electron:build -- ${{ matrix.build_args }} --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7

  # Only Linux gets a dev build: the BO's self-update ("Mise à jour" tab) only ever runs on
  # the Linux cabinet/Pi (see isSelfUpdateCapable() in src/boServer.ts) - macOS/Windows
  # artifacts stay workflow-artifact-only (7-day retention, above), not worth publishing.
  publish-develop-prerelease:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist_electron
          merge-multiple: true

      - name: Compute prerelease tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          short_sha=$(git rev-parse --short HEAD)
          echo "tag=${version}-dev.${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" dist_electron/*.AppImage \
            --repo "${{ github.repository }}" \
            --title "Dev build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated build from develop@${{ github.sha }}. Not reviewed, not merged to main." \
            --target develop \
            --prerelease

      - name: Prune old dev prereleases
        # Keeps the BO's "Builds de développement" list short - same intent as the old PR-builds
        # section capping itself at the 10 most recently updated open PRs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 \
              --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease) | select(.tagName | test("-dev\\."))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r old_tag; do
              gh release delete "$old_tag" --repo "${{ github.repository }}" --yes --cleanup-tag
            done
