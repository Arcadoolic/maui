name: Build

# Validation-only: builds the packaged app on develop pushes/PRs so a build
# regression is caught before it reaches main. The release build (which
# attaches the AppImage to a GitHub Release) lives in release.yml instead -
# see its comment on why that can't be a separate `release: published`
# triggered workflow.
#
# Matrix covers linux-x64, linux-arm64 (Raspberry Pi), macos-arm64, and
# windows-x64.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            build_args: --linux --x64
            artifact_glob: dist_electron/*.AppImage
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            build_args: --linux --arm64
            artifact_glob: dist_electron/*.AppImage
          - name: macos-arm64
            runner: macos-14
            build_args: --mac --arm64
            artifact_glob: dist_electron/*.zip
          - name: windows-x64
            runner: windows-latest
            build_args: --win --x64
            artifact_glob: dist_electron/*.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # pull_request: the PR branch's own commit, not GitHub's ephemeral
          # refs/pull/N/merge (default for this event) - that ref gets GC'd
          # if the PR is merged/closed before the runner fetches it, failing
          # the checkout outright. push: the branch ref as normal.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve Python interpreter for native module build
        # windows-latest's default shell is pwsh, which doesn't support
        # `source` - force bash (Git Bash, present on all GitHub-hosted
        # runners including Windows) so this step works across the matrix.
        shell: bash
        run: |
          source scripts/resolve-python.sh
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Suffixes develop-validation artifact filenames so they never
          # collide with a same-version release build (electron-builder
          # throws if this is unset - see electron-builder.yml's artifactName).
          ARTIFACT_SUFFIX: -dev
        run: npm run electron:build -- ${{ matrix.build_args }} --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7
