name: Build

# Manual-only: builds the packaged app on demand (workflow_dispatch, pick the
# ref/branch to build from in the run UI) instead of on every develop
# push/PR - a full 4-platform matrix build for every feat/fix commit was
# wasteful. The release build (which attaches the AppImage to a GitHub
# Release) lives in release.yml instead - see its comment on why that can't
# be a separate `release: published` triggered workflow.
#
# Linux x64 and arm64 (Raspberry Pi) are always built: that is what the cabinets install. Windows
# x64 and macOS arm64 only when ticked in the run UI (inputs below): rarely needed for a develop
# build, and the macOS runners can queue for a long time. release.yml always builds all four.
#
# The publish-develop-prerelease job below additionally republishes every
# platform's build (Linux AppImages, macOS zip, Windows exe) as a GitHub
# prerelease. The BO's update card lists these as develop builds in Advanced
# configuration (src/boServer.ts's getUpdateInfo(), filtered on the GitHub
# Release `prerelease` flag, and only ever picking the running arch's Linux
# AppImage), replacing the old "builds de PR" mechanism (PR CI artifacts,
# needed a GitHub token to list).

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Also build Windows x64
        type: boolean
        default: false
      macos:
        description: Also build macOS arm64
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The build matrix: the two Linux builds, plus Windows and macOS when asked for.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Choose the platforms
        id: matrix
        env:
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
        run: |
          include='[
            {"name": "linux-x64", "runner": "ubuntu-latest", "build_args": "--linux --x64", "artifact_glob": "dist_electron/*.AppImage"},
            {"name": "linux-arm64", "runner": "ubuntu-24.04-arm", "build_args": "--linux --arm64", "artifact_glob": "dist_electron/*.AppImage"}
          ]'
          if [ "$MACOS" = "true" ]; then
            include=$(jq -c '. + [{"name": "macos-arm64", "runner": "macos-14", "build_args": "--mac --arm64", "artifact_glob": "dist_electron/*.zip"}]' <<< "$include")
          fi
          if [ "$WINDOWS" = "true" ]; then
            include=$(jq -c '. + [{"name": "windows-x64", "runner": "windows-latest", "build_args": "--win --x64", "artifact_glob": "dist_electron/*.exe"}]' <<< "$include")
          fi
          echo "matrix=$(jq -c '{include: .}' <<< "$include")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # pull_request: the PR branch's own commit, not GitHub's ephemeral
          # refs/pull/N/merge (default for this event) - that ref gets GC'd
          # if the PR is merged/closed before the runner fetches it, failing
          # the checkout outright. push: the branch ref as normal.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python (Windows)
        # windows-latest's default `python` on PATH is 3.12+ with no
        # distutils/setuptools available, so resolve-python.sh below finds
        # nothing usable there - unlike the Linux/macOS runners, which
        # already have a distutils-capable interpreter on PATH. Installing
        # 3.11 here puts a working `python` first on PATH for this job only.
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve Python interpreter for native module build
        # windows-latest's default shell is pwsh, which doesn't support
        # `source` - force bash (Git Bash, present on all GitHub-hosted
        # runners including Windows) so this step works across the matrix.
        shell: bash
        run: |
          source scripts/resolve-python.sh
          echo "PYTHON=$PYTHON" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Suffixes develop-validation artifact filenames so they never
          # collide with a same-version release build (electron-builder
          # throws if this is unset - see electron-builder.yml's artifactName).
          ARTIFACT_SUFFIX: -dev
        run: npm run electron:build -- ${{ matrix.build_args }} --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7

  # Every platform built is published, so macOS/Windows dev builds can be downloaded for testing
  # beyond the 7-day workflow artifact retention above. A cabinet is only offered a dev build
  # holding a file it can install (newestAbove() in src/class/ReleaseList.ts): a Windows one stays
  # on the latest dev build that has an installer.
  publish-develop-prerelease:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist_electron
          merge-multiple: true

      - name: Compute prerelease tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          short_sha=$(git rev-parse --short HEAD)
          echo "tag=${version}+dev.${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the platforms built in this run: no Windows or macOS file unless asked for.
          shopt -s nullglob
          files=(dist_electron/*.AppImage dist_electron/*.zip dist_electron/*.exe)
          gh release create "${{ steps.tag.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --title "Dev build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated build from ${{ github.ref_name }}@${{ github.sha }}. Not reviewed, not merged to main." \
            --target "${{ github.sha }}" \
            --prerelease

      - name: Prune old dev prereleases
        # Keeps the BO's "Builds de développement" list short - same intent as the old PR-builds
        # section capping itself at the 10 most recently updated open PRs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 \
              --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease) | select(.tagName | test("\\+dev\\."))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r old_tag; do
              gh release delete "$old_tag" --repo "${{ github.repository }}" --yes --cleanup-tag
            done
