version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Major bumps of these two shipped in 2.2.0 and broke the front at startup: the renderer
      # bundle threw "Uncaught TypeError: Cannot redefine property: prototype" at load (the BO,
      # in the main process, kept working, which made it look fine). The cause is
      # vite-plugin-electron-renderer 1.0.0, whose Node-builtin shims get wrapped by Rollup's
      # getAugmentedNamespace(); electron-log 5 also needs main-process initialization
      # (log.initialize()) and moves its log file, so both need a real migration and a check that
      # the app actually starts - a green CI build doesn't prove that. Minor/patch bumps still flow.
      - dependency-name: "vite-plugin-electron-renderer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-log"
        update-types: ["version-update:semver-major"]
      # 10.x needs conventional-changelog-writer 9+, but @semantic-release/release-notes-generator
      # still loads an older writer: generating the release notes then throws "requires
      # conventional-changelog-writer@9 or newer", which would fail the release on main.
      # Revisit once semantic-release's plugins move to writer 9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
      # vite 8 needs electron-vite 6, which is still a beta (5.0.0, the latest stable, peers
      # vite ^5 || ^6 || ^7 - `npm ci` then fails with ERESOLVE). And even with electron-vite 6
      # beta the build breaks: vite-plugin-electron-renderer 0.14.7 (pinned, see above) imports
      # esbuild, which vite 8 (Rolldown) no longer brings. Revisit once electron-vite 6 is stable.
      - dependency-name: "vite"
        versions: ["8.x"]
      # TypeScript 7 is blocked by typescript-eslint, which peers typescript <6.1.0 (also on its
      # latest and canary builds), and it removed the moduleResolution=node10 / baseUrl options
      # (tsconfig.json is already on "bundler" and paths without baseUrl). TypeScript 6 is in range.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
